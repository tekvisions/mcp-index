name: Update MCP Index
on:
  schedule:
    - cron: "32 9 * * *"
  workflow_dispatch:
    inputs:
      promote:
        description: Promote only after all candidate checks pass (main only)
        type: boolean
        required: true
        default: false
permissions:
  contents: write
# No push trigger. The bot state commit must not create a refresh loop.
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  refresh:
    timeout-minutes: 55
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROMOTE: ${{ github.event_name == 'schedule' || inputs.promote == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify existing release credentials and target branch
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN"
          if [ "$PROMOTE" = true ]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          fi
      - run: python -m pip install Pillow==11.3.0
      - run: npm install --global vercel@53.1.0
      - run: python -m unittest discover -s tests
      - run: node --test tests/*.test.mjs
      - name: Complete bounded registry traversal
        run: python registry_collect.py --out .release/capture
      - name: Build and verify immutable output
        run: python release_pipeline.py build --capture .release/capture --out .release/candidate
      - name: Publish verified candidate and optionally promote
        shell: bash
        run: |
          flags=()
          if [ "$PROMOTE" = true ]; then
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
            flags+=(--promote)
          fi
          python publish_release.py --package .release/candidate --receipts .release/receipts "${flags[@]}"
      - name: Persist route union and bounded history only after verified production
        if: ${{ env.PROMOTE == 'true' }}
        run: |
          python -c 'import json; r=json.load(open(".release/receipts/release.json")); assert r["status"]=="production_verified" and r["promoted"] is True'
          cp .release/candidate/route-history.json route-history.json
          cp .release/candidate/.catalog-state.json.gz .catalog-state.json.gz
          git config user.name mcp-index-bot
          git config user.email actions@users.noreply.github.com
          git add route-history.json .catalog-state.json.gz
          if ! git diff --cached --quiet; then
            git commit -m "data: preserve verified catalog route union and history"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-mcp-release
          path: .release/
          include-hidden-files: true
          retention-days: 7
